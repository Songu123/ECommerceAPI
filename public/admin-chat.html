<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body {
            background: #f8f9fa;
        }
        .admin-header {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 20px 0;
        }
        .stats-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .stats-card:hover {
            transform: translateY(-5px);
        }
        .chat-monitoring {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
        }
        .room-stats {
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <h2><i class="fas fa-shield-alt"></i> Admin Chat Dashboard</h2>
            <p class="mb-0">Quản lý và giám sát hệ thống chat</p>
        </div>
    </div>

    <div class="container mt-4">
        <!-- Stats Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="card stats-card text-center">
                    <div class="card-body">
                        <i class="fas fa-users fa-3x text-primary mb-3"></i>
                        <h4 id="totalUsers">0</h4>
                        <p class="text-muted">Người dùng online</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card text-center">
                    <div class="card-body">
                        <i class="fas fa-comments fa-3x text-success mb-3"></i>
                        <h4 id="totalRooms">0</h4>
                        <p class="text-muted">Phòng chat hoạt động</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card text-center">
                    <div class="card-body">
                        <i class="fas fa-envelope fa-3x text-warning mb-3"></i>
                        <h4 id="totalMessages">0</h4>
                        <p class="text-muted">Tin nhắn hôm nay</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card text-center">
                    <div class="card-body">
                        <i class="fas fa-chart-line fa-3x text-info mb-3"></i>
                        <h4 id="avgResponse">2.5s</h4>
                        <p class="text-muted">Thời gian phản hồi TB</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Monitoring -->
        <div class="chat-monitoring">
            <h4>Giám sát Chat Real-time</h4>
            <div class="row">
                <div class="col-md-6">
                    <h6>Phòng Chat Hoạt Động</h6>
                    <div id="activeRooms">
                        <!-- Room stats will be populated here -->
                    </div>
                </div>
                <div class="col-md-6">
                    <h6>Tin nhắn gần đây</h6>
                    <div id="recentMessages" style="max-height: 400px; overflow-y: auto;">
                        <!-- Recent messages will be shown here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions Panel -->
        <div class="chat-monitoring">
            <h4>Hành động Admin</h4>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="broadcastMessage" class="form-label">Gửi thông báo toàn server</label>
                        <textarea class="form-control" id="broadcastMessage" rows="3" placeholder="Nhập thông báo..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="sendBroadcast()">
                        <i class="fas fa-bullhorn"></i> Gửi thông báo
                    </button>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="roomToBlock" class="form-label">Khóa phòng chat</label>
                        <input type="text" class="form-control" id="roomToBlock" placeholder="Tên phòng chat">
                    </div>
                    <button class="btn btn-danger" onclick="blockRoom()">
                        <i class="fas fa-ban"></i> Khóa phòng
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let stats = {
            users: 0,
            rooms: 0,
            messages: 0
        };

        // Simulate real-time stats updates
        function updateStats() {
            // In a real app, these would come from the server
            stats.users = Math.floor(Math.random() * 50) + 10;
            stats.rooms = Math.floor(Math.random() * 10) + 3;
            stats.messages = Math.floor(Math.random() * 500) + 100;

            document.getElementById('totalUsers').textContent = stats.users;
            document.getElementById('totalRooms').textContent = stats.rooms;
            document.getElementById('totalMessages').textContent = stats.messages;
        }

        // Listen for new messages across all rooms
        socket.on('newMessage', (message) => {
            addRecentMessage(message);
            updateStats();
        });

        function addRecentMessage(message) {
            const recentMessages = document.getElementById('recentMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'alert alert-light mb-2';
            messageDiv.innerHTML = `
                <strong>${message.sender}</strong> in #${message.chatRoom}
                <br><small class="text-muted">${new Date().toLocaleTimeString()}</small>
                <br>${message.text}
            `;
            
            recentMessages.insertBefore(messageDiv, recentMessages.firstChild);
            
            // Keep only last 10 messages
            while (recentMessages.children.length > 10) {
                recentMessages.removeChild(recentMessages.lastChild);
            }
        }

        function updateActiveRooms() {
            const activeRooms = document.getElementById('activeRooms');
            const rooms = ['general', 'support', 'sales', 'technical'];
            
            activeRooms.innerHTML = '';
            rooms.forEach(room => {
                const roomDiv = document.createElement('div');
                roomDiv.className = 'room-stats';
                const memberCount = Math.floor(Math.random() * 20) + 1;
                const messageCount = Math.floor(Math.random() * 100) + 10;
                
                roomDiv.innerHTML = `
                    <strong>#${room}</strong>
                    <br><small>${memberCount} thành viên • ${messageCount} tin nhắn</small>
                `;
                activeRooms.appendChild(roomDiv);
            });
        }

        function sendBroadcast() {
            const message = document.getElementById('broadcastMessage').value.trim();
            if (message) {
                // In a real app, emit this to server
                socket.emit('adminBroadcast', {
                    message: message,
                    type: 'announcement'
                });
                
                document.getElementById('broadcastMessage').value = '';
                alert('Thông báo đã được gửi!');
            }
        }

        function blockRoom() {
            const roomName = document.getElementById('roomToBlock').value.trim();
            if (roomName) {
                // In a real app, emit this to server
                socket.emit('adminBlockRoom', { roomName });
                
                document.getElementById('roomToBlock').value = '';
                alert(`Phòng "${roomName}" đã được khóa!`);
            }
        }

        // Initialize dashboard
        updateStats();
        updateActiveRooms();

        // Update stats every 5 seconds
        setInterval(updateStats, 5000);
        setInterval(updateActiveRooms, 10000);
    </script>
</body>
</html>
