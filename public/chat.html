<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-sidebar {
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            height: 500px;
            overflow-y: auto;
        }
        
        .room-list {
            padding: 15px;
        }
        
        .room-item {
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .room-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .room-item.active {
            background: #667eea;
            color: white;
        }
        
        .chat-main {
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.own {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .message.other {
            background: white;
            border: 1px solid #e9ecef;
            margin-right: auto;
        }
        
        .message-sender {
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 3px;
            opacity: 0.8;
        }
        
        .message-time {
            font-size: 0.7em;
            opacity: 0.6;
            margin-top: 3px;
        }
        
        .message-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
        }
        
        .user-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 20px;
        }
        
        .online-indicator {
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .btn-send {
            background: #667eea;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .btn-send:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="chat-container">
                    <div class="chat-header">
                        <h3><i class="fas fa-comments"></i> E-Commerce Live Chat</h3>
                        <p class="mb-0">Kết nối và trò chuyện với khách hàng</p>
                    </div>
                    
                    <div class="row g-0">
                        <!-- Sidebar -->
                        <div class="col-md-4 chat-sidebar">
                            <!-- User Info -->
                            <div class="user-info">
                                <div class="user-avatar">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div id="username-display">Guest User</div>
                                <span class="online-indicator"></span>
                                <small class="text-muted">Online</small>
                            </div>
                            
                            <!-- Room Creation -->
                            <div class="p-3">
                                <div class="input-group mb-3">
                                    <input type="text" id="roomNameInput" class="form-control" placeholder="Tên phòng chat">
                                    <button class="btn btn-outline-primary" id="createRoomBtn">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Rooms List -->
                            <div class="room-list">
                                <h6 class="text-muted mb-3">Phòng Chat</h6>
                                <div id="roomsList">
                                    <div class="room-item" data-room="general">
                                        <i class="fas fa-hashtag"></i> General
                                    </div>
                                    <div class="room-item" data-room="support">
                                        <i class="fas fa-headset"></i> Support
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Main Chat -->
                        <div class="col-md-8">
                            <div class="chat-main">
                                <!-- Current Room Header -->
                                <div class="p-3 bg-light border-bottom">
                                    <h5 class="mb-0" id="currentRoomName">
                                        <i class="fas fa-hashtag"></i> Chọn một phòng chat
                                    </h5>
                                    <small class="text-muted" id="roomMembers">0 thành viên</small>
                                </div>
                                
                                <!-- Messages -->
                                <div class="messages-container" id="messagesContainer">
                                    <div class="text-center text-muted">
                                        <i class="fas fa-comment-dots fa-3x mb-3"></i>
                                        <p>Chọn một phòng chat để bắt đầu trò chuyện</p>
                                    </div>
                                </div>
                                
                                <!-- Message Input -->
                                <div class="message-input-container">
                                    <div class="input-group">
                                        <input type="text" id="messageInput" class="form-control" 
                                               placeholder="Nhập tin nhắn..." disabled>
                                        <button class="btn btn-send" id="sendBtn" disabled>
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script>
        // Socket.io connection
        const socket = io();
        let currentRoom = '';
        let currentUser = 'User_' + Math.floor(Math.random() * 1000);
        
        // Update username display
        document.getElementById('username-display').textContent = currentUser;
        
        // Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const roomsList = document.getElementById('roomsList');
        const currentRoomName = document.getElementById('currentRoomName');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const roomNameInput = document.getElementById('roomNameInput');
        
        // Socket events
        socket.on('connect', () => {
            console.log('Connected to server');
            showToast('Đã kết nối thành công!', 'success');
        });
        
        socket.on('disconnect', () => {
            showToast('Mất kết nối với server', 'danger');
        });
        
        socket.on('newMessage', (message) => {
            displayMessage(message);
        });
        
        socket.on('oldMessages', (messages) => {
            messagesContainer.innerHTML = '';
            messages.forEach(message => {
                displayMessage(message);
            });
        });
        
        socket.on('errorMessage', (error) => {
            showToast(error.error, 'danger');
        });
        
        // Room selection
        roomsList.addEventListener('click', (e) => {
            const roomItem = e.target.closest('.room-item');
            if (roomItem) {
                const roomName = roomItem.dataset.room;
                joinRoom(roomName);
            }
        });
        
        // Create room
        createRoomBtn.addEventListener('click', () => {
            const roomName = roomNameInput.value.trim();
            if (roomName) {
                createRoom(roomName);
                roomNameInput.value = '';
            }
        });
        
        // Send message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function joinRoom(roomName) {
            if (currentRoom) {
                socket.leave(currentRoom);
            }
            
            currentRoom = roomName;
            socket.emit('joinRoom', roomName);
            
            // Update UI
            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-room="${roomName}"]`).classList.add('active');
            
            currentRoomName.innerHTML = `<i class="fas fa-hashtag"></i> ${roomName}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            // Clear messages and load room messages
            messagesContainer.innerHTML = '';
            loadRoomMessages(roomName);
            
            showToast(`Đã tham gia phòng: ${roomName}`, 'info');
        }
        
        function createRoom(roomName) {
            const roomItem = document.createElement('div');
            roomItem.className = 'room-item';
            roomItem.dataset.room = roomName;
            roomItem.innerHTML = `<i class="fas fa-hashtag"></i> ${roomName}`;
            roomsList.appendChild(roomItem);
            
            showToast(`Phòng "${roomName}" đã được tạo`, 'success');
        }
        
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text && currentRoom) {
                const messageData = {
                    chatRoom: currentRoom,
                    sender: currentUser,
                    text: text
                };
                
                socket.emit('sendMessage', messageData);
                messageInput.value = '';
            }
        }
        
        function displayMessage(message) {
            const messageDiv = document.createElement('div');
            const isOwnMessage = message.sender === currentUser;
            
            messageDiv.className = `message ${isOwnMessage ? 'own' : 'other'}`;
            
            const time = new Date(message.createdAt || Date.now()).toLocaleTimeString('vi-VN', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            messageDiv.innerHTML = `
                ${!isOwnMessage ? `<div class="message-sender">${message.sender}</div>` : ''}
                <div class="message-text">${message.text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function loadRoomMessages(roomName) {
            // Messages will be loaded automatically when joining room via socket
            const loadingMessage = document.createElement('div');
            loadingMessage.className = 'text-center text-muted';
            loadingMessage.innerHTML = `
                <div class="spinner-border spinner-border-sm" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Đang tải tin nhắn...</p>
            `;
            messagesContainer.appendChild(loadingMessage);
        }
        
        function showToast(message, type = 'info') {
            const toastContainer = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0`;
            toast.setAttribute('role', 'alert');
            
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Initialize and show toast
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            // Remove toast after it's hidden
            toast.addEventListener('hidden.bs.toast', () => {
                toast.remove();
            });
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
